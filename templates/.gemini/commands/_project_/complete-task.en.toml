description = "Mark a task as completed and archive it"
prompt = """
Complete task {{args}}.

Task scope may be omitted or explicitly overridden with `--task <ref>` / `-t <ref>`; dedicated anchors such as `--pr` retain their existing meaning.

Read and execute the complete-task skill from `.agents/skills/complete-task/SKILL.md`.

Follow all steps defined in the skill exactly.
"""
