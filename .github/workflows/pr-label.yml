name: PR Label & Assignee

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-and-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.9.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build platform sync core
        run: npm run build

      - name: Sync in-labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node dist/bin/internal-cli.js platform-pr sync-in-labels --pr "$PR_NUMBER" --cwd "$GITHUB_WORKSPACE"

      - name: Assign PR creator if unassigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CREATOR: ${{ github.event.pull_request.user.login }}
          ASSIGNEES_JSON: ${{ toJSON(github.event.pull_request.assignees) }}
        run: |
          count=$(printf '%s' "$ASSIGNEES_JSON" | jq 'length')
          if [ "$count" -eq 0 ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --add-assignee "$CREATOR" 2>/dev/null || true
          fi
