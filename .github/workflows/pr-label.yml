name: PR Label & Assignee

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: pr-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.bundle.outputs.digest }}
      source_sha: ${{ steps.bundle.outputs.source_sha }}
      lock_digest: ${{ steps.bundle.outputs.lock_digest }}
    steps:
      - name: Checkout trusted event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.9.0
          package-manager-cache: false
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Package locked dependencies
        id: bundle
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tar -cf "$RUNNER_TEMP/pr-label-dependencies.tar" node_modules
          printf 'digest=%s\n' "$(sha256sum "$RUNNER_TEMP/pr-label-dependencies.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'lock_digest=%s\n' "$(sha256sum package-lock.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-label-locked-dependencies
          path: ${{ runner.temp }}/pr-label-dependencies.tar
          if-no-files-found: error
          retention-days: 1

  label-and-assign:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout the same trusted event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.9.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-label-locked-dependencies
          path: ${{ runner.temp }}/pr-label-artifact
      - name: Verify locked dependencies
        env:
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.digest }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_LOCK: ${{ needs.prepare.outputs.lock_digest }}
        run: |
          set -eu
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$RUNNER_TEMP/pr-label-artifact/pr-label-dependencies.tar" | sha256sum -c -
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf '%s  %s\n' "$EXPECTED_LOCK" package-lock.json | sha256sum -c -
          tar -xf "$RUNNER_TEMP/pr-label-artifact/pr-label-dependencies.tar" -C "$GITHUB_WORKSPACE"
      - name: Sync and verify in-labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          node --experimental-strip-types ./bin/internal-cli.ts platform-pr sync-in-labels --pr "$PR_NUMBER" --cwd "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/in-label-receipt.json" || {
            cat "$RUNNER_TEMP/in-label-receipt.json"
            exit 1
          }
          cat "$RUNNER_TEMP/in-label-receipt.json"
          jq -e '
            . as $r |
            (.error == null) and
            ([.operations[] | select(.name == "labels:in:pull-request" and (.status == "applied" or .status == "no-op"))] | length == 1) and
            ([.resources[] | select(.kind == "pull-request" and .after != null and (([.after[] | select(startswith("in:"))] | sort) == (.expected | sort)))] | length == 1) and
            ((.evidence.closingIssues | length) as $n |
              if $n == 1 then
                ([.operations[] | select(.name == "labels:in:issue" and (.status == "applied" or .status == "no-op"))] | length == 1) and
                ([.resources[] | select(.kind == "issue" and .after != null and (([.after[] | select(startswith("in:"))] | sort) == (.expected | sort)))] | length == 1)
              else
                ([.operations[] | select(.name == "closing-issues" and (.reasonCode == "ISSUE_ASSOCIATION_NONE" or .reasonCode == "ISSUE_ASSOCIATION_AMBIGUOUS"))] | length == 1)
              end)
          ' "$RUNNER_TEMP/in-label-receipt.json" >/dev/null
      - name: Assign PR creator if still unassigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CREATOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -eu
          endpoint="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER"
          before=$(gh api "$endpoint" --jq '[.assignees[].login]')
          if [ "$(printf '%s' "$before" | jq 'length')" -ne 0 ]; then
            echo "Existing assignees retained: $before"
            exit 0
          fi
          rc=0
          gh api --method POST "$endpoint/assignees" -f "assignees[]=$CREATOR" || rc=$?
          after=$(gh api "$endpoint" --jq '[.assignees[].login]') || {
            echo "Assignee readback failed; assignment outcome is unknown (write exit $rc)" >&2
            exit 1
          }
          echo "Assignees after attempt: $after"
          if [ "$rc" -ne 0 ]; then
            echo "Assignment failed or author cannot be assigned; review the readback" >&2
            exit "$rc"
          fi
          printf '%s' "$after" | jq -e --arg creator "$CREATOR" 'length == 1 and .[0] == $creator' >/dev/null || {
            echo "Author missing or concurrent assignment detected; review assignees" >&2
            exit 1
          }
