name: Pack Smoke

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: pack-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-smoke:
    name: npm pack + install (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify native lock process lifecycle
        run: node --experimental-strip-types --test tests/e2e/sandbox/native-file-lock.test.ts

      - name: Pack tarball
        shell: bash
        run: |
          set -euxo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          TARBALL=$(ls "$RUNNER_TEMP"/fitlab-ai-agent-infra-*.tgz)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          ls -la "$TARBALL"

      - name: Install tarball in isolated tree
        shell: bash
        run: |
          set -euxo pipefail
          SMOKE_DIR="$RUNNER_TEMP/agent-infra-smoke"
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts "$TARBALL"

      - name: Smoke - version
        shell: bash
        run: |
          cd "$RUNNER_TEMP/agent-infra-smoke"
          ./node_modules/.bin/agent-infra version

      - name: Smoke - native file lock
        shell: bash
        run: |
          cd "$RUNNER_TEMP/agent-infra-smoke"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { acquireSandboxResourceLock } from './node_modules/@fitlab-ai/agent-infra/dist/lib/sandbox/control/native-file-lock.js';
          const home = fs.mkdtempSync(path.join(os.tmpdir(), 'pack-native-lock-'));
          try {
            const first = acquireSandboxResourceLock('pack-smoke', { home });
            try {
              assert.throws(() => acquireSandboxResourceLock('pack-smoke', { home }), /SANDBOX_LOCK_BUSY/);
            } finally {
              first.release();
            }
            acquireSandboxResourceLock('pack-smoke', { home }).release();
          } finally {
            fs.rmSync(home, { recursive: true, force: true });
          }
          JS

      - name: Smoke - sandbox --help
        shell: bash
        run: |
          cd "$RUNNER_TEMP/agent-infra-smoke"
          ./node_modules/.bin/agent-infra sandbox --help

      - name: Smoke - init includes orchestration contracts
        shell: bash
        run: |
          set -euxo pipefail
          SMOKE_DIR="$RUNNER_TEMP/agent-infra-smoke"
          PROJECT_DIR="$SMOKE_DIR/project"
          mkdir -p "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          printf 'smokeproj\nsmokeorg\n\n\n\n\n' | "$SMOKE_DIR/node_modules/.bin/agent-infra" init
          AGENT_INFRA_PACKAGE_ROOT="$SMOKE_DIR/node_modules/@fitlab-ai/agent-infra" \
            node .agents/skills/update-agent-infra/scripts/sync-templates.js >/dev/null
          test -f .agents/skills/run-task/reference/host-validation.md
          test -f .agents/skills/run-task/config/verify.json
          "$SMOKE_DIR/node_modules/.bin/agent-infra-internal" task-orchestration --help
