name: Sandbox Linux E2E

on:
  pull_request:
    paths:
      - "bin/cli.ts"
      - "lib/sandbox/**"
      - "install.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sandbox-linux-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "bin/cli.ts"
      - "lib/sandbox/**"
      - "install.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sandbox-linux-e2e.yml"
  workflow_dispatch:

jobs:
  sandbox-linux:
    name: Linux native Docker sandbox lifecycle (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [rootful, rootless]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Link local CLI
        run: npm link

      - name: Setup rootless Docker
        if: matrix.mode == 'rootless'
        run: |
          set -euxo pipefail
          sudo apt-get update
          # uidmap / slirp4netns / dbus-user-session are the runtime dependencies
          # the rootless setup script checks for during install.
          sudo apt-get install -y uidmap slirp4netns dbus-user-session
          # Stop and disable the preinstalled rootful daemon and remove its
          # stale socket, otherwise the get.docker.com installer aborts with
          # "rootful Docker is running and accessible".
          sudo systemctl stop docker.service docker.socket || true
          sudo systemctl disable docker.service docker.socket || true
          sudo rm -f /var/run/docker.sock
          # Ubuntu 23.10+ ships with apparmor_restrict_unprivileged_userns=1,
          # which makes rootlesskit fail with `fork/exec /proc/self/exe:
          # permission denied`. The runner is ephemeral so we relax the sysctl
          # globally instead of authoring a dedicated AppArmor profile.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # systemd --user services die with the login session unless lingering
          # is enabled, which keeps the user manager alive for the runner user.
          sudo loginctl enable-linger "$USER"
          # The setuptool needs XDG_RUNTIME_DIR (and the dbus user socket inside
          # it) to be ready before invocation; the user manager may take a
          # moment to materialise the runtime dir after enable-linger.
          for _ in $(seq 1 30); do
            [ -d "/run/user/$(id -u)" ] && break
            sleep 1
          done
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          # Install the rootless Docker tarball under ~/bin (includes
          # dockerd-rootless-setuptool.sh). docker-ce-rootless-extras is not in
          # the apt repos available on ubuntu-latest, so use the official curl
          # bootstrap as Docker's docs recommend for that case.
          # FORCE_ROOTLESS_INSTALL bypasses the safety check in case any rootful
          # docker residue (e.g. cached socket) is still detectable.
          curl -fsSL https://get.docker.com/rootless | FORCE_ROOTLESS_INSTALL=1 sh
          export PATH="$HOME/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          dockerd-rootless-setuptool.sh install
          DOCKER_HOST="unix://${XDG_RUNTIME_DIR}/docker.sock"
          echo "DOCKER_HOST=${DOCKER_HOST}" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"
          export DOCKER_HOST
          docker info

      - name: Prepare host state
        run: |
          mkdir -p "$HOME/.claude"
          cat > "$HOME/.claude/.credentials.json" <<'JSON'
          {
            "accessToken": "stub-access-token",
            "refreshToken": "stub-refresh-token",
            "expiresAt": "2999-01-01T00:00:00.000Z",
            "scopes": ["user:profile", "user:sessions:claude_code"]
          }
          JSON

      - name: Prepare test repository
        run: |
          mkdir -p /tmp/test-repo/.agents
          cd /tmp/test-repo
          git init
          git config user.name "agent-infra CI"
          git config user.email "agent-infra-ci@example.com"
          git branch -M main
          cat > .agents/.airc.json <<'JSON'
          {
            "project": "linux-e2e",
            "org": "fitlab-ai",
            "sandbox": {
              "runtimes": ["node20"],
              "tools": ["claude-code"]
            }
          }
          JSON
          printf '# linux e2e\n' > README.md
          git add README.md .agents/.airc.json
          git commit -m "chore: prepare linux sandbox e2e fixture"

      - name: Run sandbox lifecycle
        working-directory: /tmp/test-repo
        run: |
          docker info
          ai sandbox create test-branch main
          ai sandbox ls
          container="$(docker ps --filter "label=linux-e2e.sandbox.branch=test-branch" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker exec "$container" sh -lc 'echo hello && node --version'
          test "$(docker inspect --format '{{.HostConfig.Init}}' "$container")" = true
          zombie_count() {
            docker exec "$container" sh -lc 'count=0; for stat in /proc/[0-9]*/stat; do if [ -r "$stat" ]; then state="$(awk '\''{print $3}'\'' "$stat" 2>/dev/null || true)"; [ "$state" = Z ] && count=$((count + 1)); fi; done; printf "%s\n" "$count"'
          }
          run_orphan_probe() {
            docker exec -i "$container" node - "$1" <<'NODE'
          const { spawn } = require("node:child_process");
          const mode = process.argv[2];
          const child = spawn(process.execPath, ["-e", `
          const mode = process.argv[1];
          if (mode === "term" || mode === "kill") {
            setTimeout(() => process.kill(process.pid, mode === "term" ? "SIGTERM" : "SIGKILL"), 100);
          } else {
            process.exit(mode === "nonzero" ? 23 : 0);
          }
          setTimeout(() => {}, 1000);
          `, mode], { detached: true, stdio: "ignore" });
          child.unref();
          process.stdout.write(String(child.pid) + "\n");
          NODE
          }
          probe_pending() {
            docker exec "$container" sh -lc 'pending=0; for pid in "$@"; do stat="/proc/$pid/stat"; if [ -r "$stat" ]; then state="$(awk '\''{print $3}'\'' "$stat" 2>/dev/null || true)"; [ "$state" = Z ] || pending=1; fi; done; printf "%s\n" "$pending"' sh "$@"
          }
          baseline="$(zombie_count)"
          for mode in normal nonzero term kill; do
            probe_pids=""
            for _ in $(seq 1 10); do probe_pids="$probe_pids $(run_orphan_probe "$mode")"; done
            pending=1
            for _ in $(seq 1 20); do
              pending="$(probe_pending $probe_pids)"
              final="$(zombie_count)"
              [ "$pending" -eq 0 ] && [ "$final" -le "$baseline" ] && break
              sleep 0.1
            done
            test "$pending" -eq 0
            test "$final" -le "$baseline"
            echo "zombie probe mode=$mode baseline=$baseline final=$final"
          done

      - name: Cleanup sandbox artifacts
        if: always()
        run: |
          docker ps -aq --filter "label=linux-e2e.sandbox" | xargs -r docker rm -f
          docker images -q --filter "label=linux-e2e.sandbox" | xargs -r docker rmi -f
          git -C /tmp/test-repo worktree remove --force "$HOME/.agent-infra/worktrees/linux-e2e/test-branch" 2>/dev/null || true
          git -C /tmp/test-repo branch -D test-branch 2>/dev/null || true
          rm -rf "$HOME/.agent-infra/worktrees/linux-e2e" "$HOME/.agent-infra/sandboxes"

  sandbox-linux-debian:
    name: Linux native Docker sandbox lifecycle (debian-12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:12-slim
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /home/runner/work:/home/runner/work
    env:
      HOME: /home/runner/work/_temp/debian-home
      DEBIAN_TEST_REPO: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/test-repo
    permissions:
      contents: read
    steps:
      - name: Install host prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          cat > /etc/apt/sources.list.d/docker.sources <<'EOF'
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: bookworm
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt-get update
          apt-get install -y --no-install-recommends \
            docker-ce-cli docker-buildx-plugin
          docker buildx inspect --bootstrap

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Link local CLI
        run: npm link

      - name: Prepare host state
        # Keep in sync with sandbox-linux job lifecycle.
        run: |
          mkdir -p "$HOME/.claude"
          cat > "$HOME/.claude/.credentials.json" <<'JSON'
          {
            "accessToken": "stub-access-token",
            "refreshToken": "stub-refresh-token",
            "expiresAt": "2999-01-01T00:00:00.000Z",
            "scopes": ["user:profile", "user:sessions:claude_code"]
          }
          JSON

      - name: Prepare test repository
        # Keep in sync with sandbox-linux job lifecycle.
        run: |
          mkdir -p "$DEBIAN_TEST_REPO/.agents"
          cd "$DEBIAN_TEST_REPO"
          git init
          git config user.name "agent-infra CI"
          git config user.email "agent-infra-ci@example.com"
          git branch -M main
          cat > .agents/.airc.json <<'JSON'
          {
            "project": "linux-e2e",
            "org": "fitlab-ai",
            "sandbox": {
              "runtimes": ["node20"],
              "tools": ["claude-code"]
            }
          }
          JSON
          printf '# linux e2e\n' > README.md
          git add README.md .agents/.airc.json
          git commit -m "chore: prepare linux sandbox e2e fixture"

      - name: Run sandbox lifecycle
        working-directory: ${{ env.DEBIAN_TEST_REPO }}
        run: |
          # The job container sees the runner workspace at both /__w and
          # /home/runner/work, but the host Docker daemon only sees the latter.
          # Use host-visible paths for every bind source passed to the daemon.
          export HOME=/home/runner/work/_temp/debian-home
          cd /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/test-repo
          docker info
          ai sandbox create test-branch main
          ai sandbox ls
          container="$(docker ps --filter "label=linux-e2e.sandbox.branch=test-branch" --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker exec "$container" sh -lc 'echo hello && node --version'
          test "$(docker inspect --format '{{.HostConfig.Init}}' "$container")" = true
          zombie_count() {
            docker exec "$container" sh -lc 'count=0; for stat in /proc/[0-9]*/stat; do if [ -r "$stat" ]; then state="$(awk '\''{print $3}'\'' "$stat" 2>/dev/null || true)"; [ "$state" = Z ] && count=$((count + 1)); fi; done; printf "%s\n" "$count"'
          }
          run_orphan_probe() {
            docker exec -i "$container" node - "$1" <<'NODE'
          const { spawn } = require("node:child_process");
          const mode = process.argv[2];
          const child = spawn(process.execPath, ["-e", `
          const mode = process.argv[1];
          if (mode === "term" || mode === "kill") {
            setTimeout(() => process.kill(process.pid, mode === "term" ? "SIGTERM" : "SIGKILL"), 100);
          } else {
            process.exit(mode === "nonzero" ? 23 : 0);
          }
          setTimeout(() => {}, 1000);
          `, mode], { detached: true, stdio: "ignore" });
          child.unref();
          process.stdout.write(String(child.pid) + "\n");
          NODE
          }
          probe_pending() {
            docker exec "$container" sh -lc 'pending=0; for pid in "$@"; do stat="/proc/$pid/stat"; if [ -r "$stat" ]; then state="$(awk '\''{print $3}'\'' "$stat" 2>/dev/null || true)"; [ "$state" = Z ] || pending=1; fi; done; printf "%s\n" "$pending"' sh "$@"
          }
          baseline="$(zombie_count)"
          for mode in normal nonzero term kill; do
            probe_pids=""
            for _ in $(seq 1 10); do probe_pids="$probe_pids $(run_orphan_probe "$mode")"; done
            pending=1
            for _ in $(seq 1 20); do
              pending="$(probe_pending $probe_pids)"
              final="$(zombie_count)"
              [ "$pending" -eq 0 ] && [ "$final" -le "$baseline" ] && break
              sleep 0.1
            done
            test "$pending" -eq 0
            test "$final" -le "$baseline"
            echo "zombie probe mode=$mode baseline=$baseline final=$final"
          done

      - name: Cleanup sandbox artifacts
        if: always()
        run: |
          docker ps -aq --filter "label=linux-e2e.sandbox" | xargs -r docker rm -f
          docker images -q --filter "label=linux-e2e.sandbox" | xargs -r docker rmi -f
          git -C "$DEBIAN_TEST_REPO" worktree remove --force "$HOME/.agent-infra/worktrees/linux-e2e/test-branch" 2>/dev/null || true
          git -C "$DEBIAN_TEST_REPO" branch -D test-branch 2>/dev/null || true
          rm -rf "$HOME/.agent-infra/worktrees/linux-e2e" "$HOME/.agent-infra/sandboxes"
